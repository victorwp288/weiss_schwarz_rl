name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-type-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --frozen --extra dev

      - name: Ruff
        run: uv run --frozen --extra dev ruff check python tests examples

      - name: Mypy
        run: uv run --frozen --extra dev mypy

      - name: Pytest
        run: uv run --frozen --extra dev pytest -q python/weiss_rl/tests
