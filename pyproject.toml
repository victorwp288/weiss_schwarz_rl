[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "weiss-schwarz-rl"
version = "0.1.0"
description = "Thesis RL pipeline scaffold for Weiss Schwarz."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch==2.5.1",
    "numpy==2.1.3",
    "scipy==1.14.1",
    "matplotlib==3.10.1",
    "tensorboard>=2.18,<3",
    "psutil>=6,<7",
    "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = [
    "build>=1,<2",
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
    "pre-commit>=4,<5",
    "types-PyYAML>=6.0.12.20241230,<7",
]
sim = [
    "weiss-sim==0.7.0",
]

[tool.setuptools]
package-dir = {"" = "python"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
weiss_rl = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B"]

[tool.pytest.ini_options]
markers = [
    "simulator: tests that require the published weiss-sim package or sibling checkout",
    "artifact: tests that exercise artifact and docs contracts",
    "slow: longer-running smoke or integration tests",
]
