family_c_shaping_ablation:
  enabled_by_default: false
  stall_trigger:
    after_updates: 500000
    eval_opponent: RandomLegal
    eval_seed_file: dev_eval_seeds.txt
    seat_swap: true
    probability_metric: "P(p_champ_vs_random > 0.55)"
    trigger_if_below: 0.60
  shaping_defaults:
    terminal_win: 1.0
    terminal_loss: -1.0
    terminal_draw_timeout: 0.0
    per_learner_step_penalty_formula: "-lambda / max_learner_steps_per_episode"
    lambda_default: 0.10
    max_total_shaping_magnitude_per_episode: 0.10
  truncation_reward: 0.0
