schema_version: 2
description: Active server alias for the S1 frozen-B1 residual league loop.
experiment:
  role: main
system:
  profile:
    training: fast
    local_iteration: fast
    ci_invariant_testing: debug
  mp_start_method: spawn
  learner_device: cuda:auto
  actor_device: cuda:auto
  actor_process_count: 32
  envs_per_actor: 8
  total_envs: 96
  actor_torch_threads: 1
  learner_torch_threads: 16
  actor_queue_capacity_unrolls: 256
  learner_prefetch_batches: 4
  collection_backend: process
model:
  gru_hidden_size: 192
  encoder_mlp_width: 192
  encoder_mlp_layers: 2
  encoder_kind: structured_v2
  typed_feature_width: 48
  recurrent_core: gru
  layer_norm: true
  dropout:
    family_a: 0.0
    ablation: 0.1
  cuda_learner_candidate_scoring_chunk_size: 1048576
  public_heuristic_logit_bias_scale: 1.0
  public_heuristic_actor_logit_bias_scale: 1.0
  public_heuristic_logit_bias_final_scale: 1.0
  public_heuristic_logit_bias_families:
  - main_play_character
  - main_move
  - attack
  public_heuristic_logit_bias_profile: aggressive
  public_heuristic_logit_bias_start_updates: 450
  public_heuristic_logit_bias_end_updates: -1
training:
  algorithm: impala_vtrace_structured_v1
  rollout:
    unroll_length: 16
    batch_unrolls_per_update: 64
  optimizer:
    name: Adam
    backend: auto
    learning_rate: 0.0003
    grad_norm_clip: 40.0
    value_loss_coef: 0.0
  exploration:
    entropy_coef: 0.04
    entropy_anneal_to: 0.02
    entropy_anneal_steps_updates: 300000
  precision:
    mixed_precision: false
    compile_learner: false
    compile_actor_inference: false
    masking_math_float32: true
  scaling:
    learner_parallelism: auto
    learner_gpu_count: auto
    actor_topology: auto
    target_envs_per_gpu: 512
    min_envs_per_actor: 32
    max_envs_per_actor: 64
    max_actor_process_count: 64
    reserve_cpu_cores: 4
    learner_cpu_cores_per_gpu: 2
    queue_depth_multiplier: 2
    ram_queue_fraction: 0.25
    vram_fraction: 0.85
  checkpointing:
    checkpoint_interval_updates: 5
    snapshot_interval_updates: 5
    actor_reload_interval_updates: 5
  vtrace:
    rho_bar: 1.0
    c_bar: 1.0
  ppo:
    clip_epsilon: 0.2
    value_clip_epsilon: 0.2
    gae_lambda: 0.95
    epochs: 4
    target_kl: 0.03
    normalize_advantages: true
  profile_timers: true
  structured_metrics:
    mode: sampled
  teacher_aux:
    mode: 'off'
  fixed_opponent_backend: simulator_native
  structured_aux:
    enabled: true
    teacher_family_coef: 0.0
    teacher_slot_coef: 0.0
    teacher_attack_type_coef: 0.0
    teacher_action_coef: 0.0
    teacher_public_heuristic_coef: 0.0
    teacher_public_heuristic_final_coef: 0.0
    teacher_public_heuristic_profiles:
    - aggressive
    teacher_public_heuristic_profile_mode: cycle
    teacher_public_heuristic_families:
    - mulligan_select
    - clock_from_hand
    - main_play_character
    - main_play_event
    - climax_play
    - main_move
    - attack
    - level_up
    - encore_pay
    - encore_decline
    - trigger_order
    - choice_select
    teacher_public_heuristic_label_profile: aggressive
    teacher_public_heuristic_temperature: 8.0
    teacher_public_main_move_coef: 0.0
    teacher_move_source_coef: 0.0
    teacher_same_family_action_coef: 0.0
  structured_warmstart:
    enabled: false
    updates: 1
    teacher_family_coef: 0.75
    teacher_slot_coef: 0.35
    teacher_attack_type_coef: 0.2
    teacher_action_coef: 0.5
    teacher_public_heuristic_coef: 0.5
    teacher_public_heuristic_profiles:
    - base
    - aggressive
    - control
    teacher_public_heuristic_profile_mode: cycle
    teacher_public_heuristic_families:
    - mulligan_select
    - clock_from_hand
    - main_play_character
    - main_play_event
    - climax_play
    - main_move
    - attack
    - level_up
    - encore_pay
    - encore_decline
    - trigger_order
    - choice_select
  actor_policy_backend: model
  actor_heuristic_fraction: 0.0
  heuristic_native_rollout_enabled: false
  heuristic_actor_hidden_state_tracking: true
  heuristic_native_rollout_profile: aggressive
  collect_batch_prefetch_enabled: true
  train_on_heuristic_actor_rows: false
  diverse_opponent_actor_count: 2
  diverse_model_actor_count: 2
  actor_heuristic_final_fraction: 0.0
  behavior_action_bc_coef: 0.0
  reference_policy_id: b1_noleague_baseline
  reference_policy_top_action_bc_coef: 0.0
  reference_policy_top_action_bc_final_coef: 0.0
  reference_policy_top_action_bc_start_updates: 450
  reference_policy_top_action_bc_end_updates: 520
  reference_policy_top_action_family_bc_coef: 0.0
  reference_policy_top_action_family_bc_final_coef: 0.0
  reference_policy_top_action_family_bc_start_updates: 450
  reference_policy_top_action_family_bc_end_updates: 520
  raw_b1_distill:
    enabled: false
    teacher_policy_id: b1_noleague_baseline
    teacher_surface: raw_s0
    student_surface: raw_s0
    coef: 0.0
    final_coef: 0.0
    start_updates: 450
    end_updates: 650
    top_k: 16
    temperature: 1.5
    teacher_public_heuristic_bias_scale: 0.0
    student_public_heuristic_bias_scale: 0.0
  diverse_opponent_policy_ids:
  - b1_residual_6label_conservative_a01_l2
  - b1_residual_7label_nonpass_a01_l2
  - b1_residual_9label_passmix_a01_l2loose
  - b1_residual_rush_10label_passmix_final800
  - b1_residual_trainable_live_10label_l2x
  - b1_residual_trainable_live_mine1_retrain_l2x
  - b1_residual_trainable_live_alpha010_l2low
  - b1_residual_10label_familygated_a01_l2
  residual_opponent_policies:
  - policy_id: b1_residual_6label_conservative_a01_l2
    role: b1_exploiter_confirmed_hard_negative
    base_snapshot_path: runs/b1_continue_u100_trainheurrows_lowlr_u450_s3_20260425/training/checkpoints/checkpoint_450.pt
    residual_state_path: runs/b1_s1_distillonly_u450_to_u455_20260427/eval/b1_residual_adoption_probe_6label_conservative_a01_l2_20260428/residual_state.pt
    public_heuristic_bias_scale: 1.0
  - policy_id: b1_residual_7label_nonpass_a01_l2
    role: b1_exploiter_diversity_hard_negative
    base_snapshot_path: runs/b1_continue_u100_trainheurrows_lowlr_u450_s3_20260425/training/checkpoints/checkpoint_450.pt
    residual_state_path: runs/b1_s1_distillonly_u450_to_u455_20260427/eval/b1_residual_adoption_probe_7label_nonpass_a01_l2_20260428/residual_state.pt
    public_heuristic_bias_scale: 1.0
  - policy_id: b1_residual_9label_passmix_a01_l2loose
    role: b1_exploiter_diversified_hard_negative
    base_snapshot_path: runs/b1_continue_u100_trainheurrows_lowlr_u450_s3_20260425/training/checkpoints/checkpoint_450.pt
    residual_state_path: runs/b1_s1_distillonly_u450_to_u455_20260427/eval/b1_residual_adoption_probe_9label_passmix_a01_l2loose_800s_20260428/residual_state.pt
    public_heuristic_bias_scale: 1.0
  - policy_id: b1_residual_rush_10label_passmix_final800
    role: b1_exploiter_primary_hard_negative
    base_snapshot_path: runs/b1_continue_u100_trainheurrows_lowlr_u450_s3_20260425/training/checkpoints/checkpoint_450.pt
    residual_state_path: runs/b1_s1_distillonly_u450_to_u455_20260427/eval/b1_residual_adoption_probe_rush_rush_pass_screen_20260428a_final800/residual_state.pt
    public_heuristic_bias_scale: 1.0
  - policy_id: b1_residual_trainable_live_10label_l2x
    role: b1_exploiter_trainable_live_hard_negative
    base_snapshot_path: runs/b1_continue_u100_trainheurrows_lowlr_u450_s3_20260425/training/checkpoints/checkpoint_450.pt
    residual_state_path: runs/b1_s1_distillonly_u450_to_u455_20260427/eval/b1_trainable_live_residual_10label_plain_a01_lr3e4_l2x_20260428/residual_state.pt
    public_heuristic_bias_scale: 1.0
  - policy_id: b1_residual_trainable_live_mine1_retrain_l2x
    role: b1_exploiter_trainable_live_retrain_hard_negative
    base_snapshot_path: runs/b1_continue_u100_trainheurrows_lowlr_u450_s3_20260425/training/checkpoints/checkpoint_450.pt
    residual_state_path: runs/b1_s1_distillonly_u450_to_u455_20260427/eval/b1_residual_adoption_probe_rush_trainlive_mine1_20260428a/residual_state.pt
    public_heuristic_bias_scale: 1.0
  - policy_id: b1_residual_trainable_live_alpha010_l2low
    role: b1_exploiter_trainable_live_diversity_hard_negative
    base_snapshot_path: runs/b1_continue_u100_trainheurrows_lowlr_u450_s3_20260425/training/checkpoints/checkpoint_450.pt
    residual_state_path: runs/b1_s1_distillonly_u450_to_u455_20260427/eval/b1_residual_adoption_probe_rush_trainlive_alpha010_l2low_nomine_20260428/residual_state.pt
    public_heuristic_bias_scale: 1.0
  - policy_id: b1_residual_10label_familygated_a01_l2
    role: b1_exploiter_family_gated_hard_negative
    base_snapshot_path: runs/b1_continue_u100_trainheurrows_lowlr_u450_s3_20260425/training/checkpoints/checkpoint_450.pt
    residual_state_path: runs/b1_s1_distillonly_u450_to_u455_20260427/eval/b1_residual_adoption_probe_10label_familygated_a01_l2_20260428/residual_state.pt
    public_heuristic_bias_scale: 1.0
  counterfactual_positive:
    enabled: true
    label_dirs:
    - runs/b1_s1_distillonly_u450_to_u455_20260427/eval/b1_cf_labels_s1_candidate_reps_p8_t24_a6_tensor_20260427
    - runs/b1_s1_distillonly_u450_to_u455_20260427/eval/b1_cf_labels_s1_mainmove_no_pass_p8_t20_a2_stop1_20260427
    - runs/b1_s1_distillonly_u450_to_u455_20260427/eval/b1_cf_labels_s1_pass_overextend_exclude2_p8_t80_a8_stop5_20260428
    - runs/b1_s1_distillonly_u450_to_u455_20260427/eval/b1_cf_labels_s1_nonpass_exclude6_p16_t120_a8_stop3_20260428
    - runs/b1_s1_distillonly_u450_to_u455_20260427/eval/b1_cf_labels_s1_pass_overextend_exclude7_p16_t100_a4_stop3_20260428
    coef: 3.0
    final_coef: 2.0
    start_updates: 0
    end_updates: 20
    margin_coef: 0.3
    margin: 1.5
    max_labels: 10
  main_residual_policy:
    enabled: true
    base_snapshot_path: runs/b1_continue_u100_trainheurrows_lowlr_u450_s3_20260425/training/checkpoints/checkpoint_450.pt
    public_heuristic_bias_scale: 1.0
    hidden_dim: 256
    alpha: 0.1
    residual_mode: plain
    initial_residual_state_path: runs/b1_s1_distillonly_u450_to_u455_20260427/eval/b1_residual_adoption_probe_rush_trainlive_mine1_20260428a/residual_state.pt
  policy_loss_coef: 1.0
environment:
  observation_visibility: public
  visibility: public
  truncate_on_max_steps: true
  max_raw_decisions_per_episode: 4000
  max_decisions: 2000
  max_decisions_per_episode: 2000
  max_learner_steps_per_episode: 2000
  max_ticks: 100000
  deck_set_size:
    bring_up: 2
    paper: 8
rewards:
  objective: terminal_pm1
  discount:
    gamma: 0.99
  shaping:
    enable_damage_shaping: true
    damage_reward: 0.05
    level_reward: 0.0
    board_reward: 0.0
    no_progress_penalty: 0.0
  truncation:
    reward: -0.1
    bootstrap_value: false
    bootstrap_rule: if truncated and not terminated, bootstrap from V(next_state);
      if terminated, no bootstrap
curriculum:
  simulator: {}
  stall_monitor:
    enabled: false
    truncation_rate_threshold: 0.25
    consecutive_evals: 2
  checkpoint_guard:
    enabled: false
    rollback_score_margin: 0.01
    rollback_truncation_rate_threshold: 0.25
    rollback_max_prob_lt_half: 0.7
    min_best_score: 0.55
    promote_min_prob_gt_half: 0.6
    promote_max_ci_half_width: 0.24
    cooldown_updates: 20
  early_cutoff:
    enabled: false
    warmup_updates: 120
    patience_updates: 120
    min_improvement: 0.01
    stall_patience_evals: 4
    stall_rate_threshold: 0.25
league:
  enabled: true
  pool:
    recent_size: 24
    champion_size: 4
    champion_max_age_updates: 120
  sampling:
    opponent_sampling: PFSP
    pfsp_power: 1.5
    pfsp_epsilon_uniform: 0.3
    pfsp_stats_source: online_outcomes
    pfsp_window_episodes: 25000
    heuristic_public_start_updates: 0
    heuristic_public_mix_fraction: 0.1
    champion_mix_fraction: 0.0
    hard_negative_mix_fraction: 0.0
    hard_negative_min_samples: 16
    hard_negative_max_win_rate: 0.45
    heuristic_public_final_mix_fraction: 0.1
    noleague_baseline_mix_fraction: 0.35
    noleague_baseline_mix_end_updates: -1
    heuristic_public_mix_end_updates: -1
    heuristic_public_variant_mix_fraction: 0.1
    heuristic_public_variant_final_mix_fraction: 0.15
    heuristic_public_variant_mix_end_updates: -1
    noleague_baseline_reward_scale: 1.0
    noleague_baseline_force_focal_seat: -1
    warmup_snapshot_mix_fraction: 0.0
    exclude_seed_snapshots_from_pfsp: true
    mirror_mix_fraction: 0.1
  warmup:
    first_updates: 200
    initial_window_episodes: 5000
    ramp_target_updates: 600
    ramp_target_window_episodes: 15000
  promotion:
    enabled: false
    paired_seeds: 8
    threshold: P(p_anchor > 0.55) > 0.95 using AnchorSet_v1
    anchor_set_v1:
      required:
      - B0 RandomLegal
      - B1 NoLeague baseline
      optional_if_available:
      - B2 HeuristicPublic
      - B3 HeuristicPublicAggro
      - B4 HeuristicPublicControl
      - Previous champion snapshot
      - Previous recent snapshot
    seed_file: configs/seeds/local_promotion_eval_seeds.txt
    gate:
      uncertainty_method: bayesian_bootstrap_seedlevel_v1
      weighting: uniform_across_anchors
      seat_swap: true
      folding: S0
      guardrails:
        max_prob_anchor_loss_below_0_45: 0.05
        max_truncation_rate: 0.05
      record_file: promotion_gate.json
      parallel_workers: 6
      async_enabled: false
evaluation:
  seat_swap: true
  eval_device: cuda:auto
  eval_inference_mode: true
  eval_sampling_algorithm: pinned_cdf_pcg_v1
  eval_assert_sorted_legal_ids: true
  seed_files:
    dev_eval: configs/seeds/local_dev_eval_seeds.txt
    report_eval: configs/seeds/report_eval_seeds.txt
    promotion_gate: configs/seeds/local_promotion_eval_seeds.txt
  periodic_dev_eval_interval_updates: 0
  periodic_dev_eval_paired_seeds: 8
  final_policy_set_size: 10
  final_matrix_stage1_paired_seeds: 64
  final_matrix_stage2_adaptive_max_paired_seeds: 256
  stop_rules:
    stop_delta_ci_half_width: 0.03
    stop_confidence: 0.95
  replay_capture_rate_eval: 0.001
  regression_capture_count: 50
  legal_fingerprint_checks:
    enabled: true
    version: legal_fingerprint_v1
    require_strictly_increasing_legal_ids: true
    mismatch_policy: hard_fail
  decision_kind_tagging:
    required_for_training: false
    enable_python_derived_debug_tag: false
  final_policy_set_selection:
    version: deterministic_v1
    include_random_legal_baseline_b0: true
    include_no_league_baseline_b1: true
    include_heuristic_public_b2_if_exists: true
    include_final_champion_snapshot: true
    include_spaced_snapshots_near_percent_updates:
    - 25
    - 50
    - 75
    remaining_slots_strategy: top_dev_performers_vs_anchor_set_v1
    fixed_anchor_set_v1:
      required:
      - B0 RandomLegal
      - B1 NoLeague baseline
      optional_if_available:
      - B2 HeuristicPublic
    seed_file: configs/seeds/dev_eval_seeds.txt
    folding: S0
    seat_swap: true
    tie_break: lowest_policy_id
  async_periodic_dev_eval_enabled: false
  periodic_dev_eval_parallel_workers: 6
  periodic_dev_eval_batched_inference_enabled: false
reproducibility:
  spec_bundle:
    require_export_spec_bundle: true
    persist_in_manifest: true
    fail_on_spec_mismatch: true
  ids:
    run_id_hash: sha256
    config_hash: sha256
    spec_hash: sha256
    store_full_256_bit_ids: true
    store_short_64_bit_ids_for_filenames: true
  seed_derivation:
    base_seed64: 20260212
    actor_seed_formula: hash64(base_seed64, actor_id)
    episode_seed_formula: hash64(actor_seed64, env_id, episode_index)
  seed_files:
    dev_eval: configs/seeds/local_dev_eval_seeds.txt
    report_eval: configs/seeds/report_eval_seeds.txt
    promotion_gate: configs/seeds/local_promotion_eval_seeds.txt
  determinism_requirements:
  - simulator_build_and_spec_bundle_match
  - environment_config_match
  - episode_seeds_match
  - action_sequence_match
  - evaluation_sampler_rng_and_algorithm_match
  legal_fingerprint:
    version: legal_fingerprint_v1
    compute_in_rl_layer: true
    canonical_bytes:
    - b'legal_fp_v1'
    - spec_hash256
    - u32_le_decision_id
    - u32_le_legal_ids_len
    - u32_le_each_legal_id
    replay_eval_mismatch_policy: hard_fail
seed_sets:
  dev_eval: configs/seeds/local_dev_eval_seeds.txt
  promotion_gate: configs/seeds/local_promotion_eval_seeds.txt
  report_eval: configs/seeds/report_eval_seeds.txt
