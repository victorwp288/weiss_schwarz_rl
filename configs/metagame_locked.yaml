metagame:
  payoff_uncertainty_method: bayesian_bootstrap_seedlevel_v1
  sampling_M: 1000
  optional_secondary_uncertainty_method: dirichlet_wldt_jeffreys_v1
  dirichlet_alpha_wldt: 0.5
  primary_analysis: Nash
  secondary_analysis: AlphaRank
  nash:
    impl: weiss_rl_nash_lp_v1
    backend: scipy_linprog_highs
    threads: 1
    value_tolerance: 1.0e-10
    tie_break: deterministic_secondary_lp_by_policy_id
  alpharank:
    impl: weiss_rl_alpharank_v1
    m: 50
    alpha: 100
    local_selection: true
    use_inf_alpha: false
    inf_alpha_eps: 0.01
