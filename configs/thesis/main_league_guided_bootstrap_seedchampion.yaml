schema_version: 2
description: "Guarded guided-bootstrap league path that treats imported seed snapshots as training-pool champions. This is a bootstrap stability probe, not thesis promotion: promotion_gate.json remains the only thesis champion signal."
extends: main_league_guided_bootstrap.yaml
league:
  pool:
    champion_max_age_updates: 0
    seed_snapshot_champion_import: all
  sampling:
    mirror_mix_fraction: 0.30
    mirror_mix_end_updates: 100
    mirror_final_mix_fraction: 0.15
    champion_mix_fraction: 0.35
    hard_negative_mix_fraction: 0.10
