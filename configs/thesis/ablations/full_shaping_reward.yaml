schema_version: 2
description: "B1 reward ablation: terminal +/-1 plus all current simulator shaping terms."
extends: reward_ablation_base.yaml
rewards:
  objective: terminal_pm1
  discount:
    gamma: 0.99
  shaping:
    enable_damage_shaping: true
    damage_reward: 0.05
    level_reward: 0.05
    board_reward: 0.02
    no_progress_penalty: 0.005
  truncation:
    reward: -0.1
    bootstrap_value: false
    bootstrap_rule: "if truncated and not terminated, bootstrap from V(next_state); if terminated, no bootstrap"
