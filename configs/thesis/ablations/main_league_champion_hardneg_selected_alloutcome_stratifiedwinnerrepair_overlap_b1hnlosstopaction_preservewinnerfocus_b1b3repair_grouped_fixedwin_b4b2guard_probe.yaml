schema_version: 2
description: "Grouped B1/B3 hard-negative repair plus fixed-win rehearsal. This variant keeps separate replay-BC quotas for fixed B1/B2/B3/B4 win rehearsal, fixed B1/B3 loss-state repair, hard-negative loss-state repair, and winner-extension repair to reduce the confirm128 fixed-baseline tax seen in the first grouped repair probe."
extends: main_league_champion_hardneg_selected_alloutcome_stratifiedwinnerrepair_overlap_b1hnlosstopaction_preservewinnerfocus_b1b3repair_grouped_b4b2guard_probe.yaml
training:
