schema_version: 2
description: "Live row-gated continuation from the a050 balanced B2-guard checkpoint. This deliberately disables local paired-swing and trajectory-BC replay so the probe tests real league exposure, not another action-margin repair sweep. B2/B4 remain sentinel constraints while champion and hard-negative lanes stay active; continue only if the tiny sentinel screen is fixed nonnegative and learned nonnegative before any full confirm64."
extends: main_league_champion_hardneg_interp_a050_u1_nowarm_balanced_b2guard_continue_probe.yaml
league:
  sampling:
    noleague_baseline_reserved_envs_per_actor: 4
    noleague_baseline_mix_fraction: 0.30
    noleague_baseline_mix_end_updates: -1
    heuristic_public_mix_fraction: 0.06
    heuristic_public_final_mix_fraction: 0.06
    heuristic_public_variant_mix_fraction: 0.18
    heuristic_public_variant_final_mix_fraction: 0.18
    champion_mix_fraction: 0.22
    hard_negative_mix_fraction: 0.18
    hard_negative_min_samples: 2
    hard_negative_max_win_rate: 0.60
    hard_negative_overlaps_champions: true
    hard_negative_focus_policy_ids:
      - seed_c3aac2f9dc_checkpoint_000025
      - seed_c3aac2f9dc_main_bestresponse_u25_devbest
      - seed_c3aac2f9dc_main_league_selected
      - seed_c3aac2f9dc_policy_000003
      - seed_c3aac2f9dc_policy_000004
      - seed_c3aac2f9dc_policy_000005
    hard_negative_focus_weight_multiplier: 2.5
training:
  optimizer:
    learning_rate: 0.000001
  exploration:
    entropy_coef: 0.001
    actor_sampling_temperature: 0.84
  structured_aux:
    policy_anchor_coef: 0.52
    policy_anchor_top_action_coef: 0.12
    policy_anchor_temperature: 0.66
    trajectory_retention_coef: 0.08
    trajectory_bc_every_updates: 0
    trajectory_bc_dataset_path: ""
    paired_swing_every_updates: 0
    paired_swing_dataset_path: ""
    paired_swing_coef: 0.0
