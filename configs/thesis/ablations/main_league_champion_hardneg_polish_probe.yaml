schema_version: 2
description: "Very-low-LR polish segment for an already confirmed main candidate. Increases champion and hard-negative pressure to test real league improvement while keeping B1 and public anchor exposure plus a stronger frozen-policy anchor so fixed-deck scores cannot drift unnoticed."
extends: main_league_champion_hardneg_long_probe.yaml
league:
  pool:
    champion_size: 6
  sampling:
    heuristic_public_mix_fraction: 0.04
    heuristic_public_final_mix_fraction: 0.04
    heuristic_public_variant_mix_fraction: 0.08
    heuristic_public_variant_final_mix_fraction: 0.08
    noleague_baseline_reserved_envs_per_actor: 4
    noleague_baseline_mix_fraction: 0.25
    noleague_baseline_mix_end_updates: -1
    champion_mix_fraction: 0.35
    hard_negative_mix_fraction: 0.20
    hard_negative_min_samples: 2
    hard_negative_max_win_rate: 0.55
training:
  optimizer:
    learning_rate: 0.00001
  structured_aux:
    policy_anchor_coef: 0.25
    policy_anchor_top_action_coef: 0.03
    policy_anchor_temperature: 0.75
    trajectory_bc_every_updates: 0
