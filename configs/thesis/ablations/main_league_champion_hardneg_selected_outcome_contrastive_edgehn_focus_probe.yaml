schema_version: 2
description: "Targeted paired-outcome contrastive probe after the full contrastive u2 branch passed fixed (+3) but lost learned (-4) at confirm128, concentrated on policy000001 and policy000005. Keeps fixed-preserve replay in the batch, keeps old hard negatives visible, and gives the slipped learned edge rows their own contrastive bucket. This is a u2 filter only; continue only if paired confirm128 shows fixed >= 0 and learned > 0 versus selected-a015."
extends: main_league_champion_hardneg_selected_outcome_contrastive_full_focusoldhn_probe.yaml
league:
  sampling:
    hard_negative_focus_policy_ids:
      - seed_c3aac2f9dc_policy_000001
      - seed_c3aac2f9dc_policy_000002
      - seed_c3aac2f9dc_checkpoint_000025
      - seed_c3aac2f9dc_main_bestresponse_u25_devbest
      - seed_c3aac2f9dc_policy_000005
    hard_negative_focus_weight_multiplier: 2.5
training:
  structured_aux:
    policy_anchor_coef: 0.36
    policy_anchor_top_action_coef: 0.075
    paired_swing_batch_episodes: 20
    paired_swing_coef: 0.05
    paired_swing_focus_groups:
      - name: outcome_fixed_preserve
        source_labels:
          - grouped128_fixed_preserve_B1 NoLeague baseline
          - grouped128_fixed_preserve_B2 HeuristicPublic
          - grouped128_fixed_preserve_B3 HeuristicPublicAggro
          - grouped128_fixed_preserve_B4 HeuristicPublicControl
        fraction: 0.40
      - name: outcome_old_hardneg_repair
        source_labels:
          - grouped128_learned_repair_seed_b8c698d26a_seed_c3aac2f9dc_policy_000002
          - grouped128_learned_repair_seed_b8c698d26a_seed_c3aac2f9dc_checkpoint_000025
          - grouped128_learned_repair_seed_b8c698d26a_seed_c3aac2f9dc_main_bestresponse_u25_devbest
        fraction: 0.30
      - name: outcome_edge_hardneg_repair
        source_labels:
          - grouped128_learned_repair_seed_b8c698d26a_seed_c3aac2f9dc_policy_000001
          - grouped128_learned_repair_seed_b8c698d26a_seed_c3aac2f9dc_policy_000005
        fraction: 0.30
