schema_version: 2
description: "Low-step champion/hard-negative continuation from the selected interpolation, intended to be judged by the multi-objective gate: fixed-deck B0-B4+B1 must be preserved while imported learned champions and emergent hard negatives must improve as a panel."
extends: main_league_champion_hardneg_stable_long_probe.yaml
league:
  pool:
    champion_size: 8
    seed_snapshot_import_filter: all
    seed_snapshot_champion_import: source_champions
  warmup:
    first_updates: 1
  sampling:
    noleague_baseline_reserved_envs_per_actor: 4
    noleague_baseline_mix_fraction: 0.30
    noleague_baseline_mix_end_updates: -1
    heuristic_public_mix_fraction: 0.05
    heuristic_public_final_mix_fraction: 0.05
    heuristic_public_variant_mix_fraction: 0.12
    heuristic_public_variant_final_mix_fraction: 0.12
    champion_mix_fraction: 0.24
    hard_negative_mix_fraction: 0.18
    hard_negative_min_samples: 2
    hard_negative_max_win_rate: 0.60
training:
  optimizer:
    learning_rate: 0.00002
  exploration:
    entropy_coef: 0.002
    actor_sampling_temperature: 0.90
  structured_aux:
    policy_anchor_coef: 0.22
    policy_anchor_top_action_coef: 0.03
    policy_anchor_temperature: 0.70
    trajectory_bc_every_updates: 1
    trajectory_bc_aux_updates: 1
    trajectory_bc_batch_episodes: 8
    trajectory_bc_teacher_action_coef: 0.10
    trajectory_bc_teacher_same_family_action_coef: 0.40
    trajectory_bc_teacher_same_family_action_margin_coef: 0.05
