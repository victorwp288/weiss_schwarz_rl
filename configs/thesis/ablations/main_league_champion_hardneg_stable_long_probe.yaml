schema_version: 2
description: "Stable longer continuation from the first champion/hard-negative candidate. Branches before the u20 B3 drift, lowers update pressure, keeps B1 residency high, keeps public anchor rehearsal visible, and reserves pool capacity for hard negatives so longer training can show league evolution without silently losing fixed-deck baselines."
extends: main_league_champion_hardneg_long_probe.yaml
league:
  pool:
    champion_size: 6
  sampling:
    heuristic_public_mix_fraction: 0.06
    heuristic_public_final_mix_fraction: 0.06
    heuristic_public_variant_mix_fraction: 0.14
    heuristic_public_variant_final_mix_fraction: 0.14
    noleague_baseline_reserved_envs_per_actor: 4
    noleague_baseline_mix_fraction: 0.32
    noleague_baseline_mix_end_updates: -1
    champion_mix_fraction: 0.18
    hard_negative_mix_fraction: 0.14
    hard_negative_min_samples: 2
    hard_negative_max_win_rate: 0.55
training:
  optimizer:
    learning_rate: 0.00003
  structured_aux:
    policy_anchor_coef: 0.18
    policy_anchor_top_action_coef: 0.02
    policy_anchor_temperature: 0.75
    trajectory_bc_dataset_path: runs/trajectory_bc_direct_b2_b3_b4_win_64_20260516/trajectory_bc_direct_b2_b3_b4_win_64.npz
    trajectory_bc_every_updates: 1
    trajectory_bc_aux_updates: 1
    trajectory_bc_batch_episodes: 8
    trajectory_bc_seed: 20260517
    trajectory_bc_teacher_family_coef: 0.05
    trajectory_bc_teacher_slot_coef: 0.05
    trajectory_bc_teacher_move_source_coef: 0.02
    trajectory_bc_teacher_attack_type_coef: 0.02
    trajectory_bc_teacher_action_coef: 0.10
    trajectory_bc_teacher_same_family_action_coef: 0.35
    trajectory_bc_teacher_same_family_action_margin_coef: 0.04
    trajectory_bc_teacher_same_family_action_margin: 0.5
