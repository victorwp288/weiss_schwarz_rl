schema_version: 2
description: "Trainable opponent-context + broad episode-mean paired-outcome probe from a075. Uses current-state conflict filtering on the grouped128/rawext/b2pair70 dataset and trains the zero-initialized opponent-context hidden adapter so fixed-anchor preserve and learned-repair rows can separate by opponent identity. Mechanistic context-margin diagnostics must pass before sentinel eval."
extends: main_league_champion_hardneg_a075_context_probe.yaml
model:
  opponent_context_hidden_scale: 0.0
  opponent_context_trainable_hidden_scale: 1.0
training:
  optimizer:
    learning_rate: 0.000001
  structured_aux:
    paired_swing_dataset_path: runs/paired_outcome_contrastive_grouped128_rawext256_plus_b2pair70_20260520/paired_outcome_contrastive_grouped128_rawext256_plus_b2pair70.npz
    paired_swing_conflict_filter: current_state
    paired_swing_loss_scope: episode_mean
    paired_swing_aux_updates: 4
    paired_swing_batch_episodes: 24
    paired_swing_coef: 0.08
    paired_swing_margin: 0.05
    paired_swing_focus_groups:
      - name: grouped_fixed_preserve
        source_labels:
          - grouped128_fixed_preserve_B1 NoLeague baseline
          - grouped128_fixed_preserve_B2 HeuristicPublic
          - grouped128_fixed_preserve_B3 HeuristicPublicAggro
          - grouped128_fixed_preserve_B4 HeuristicPublicControl
        fraction: 0.14
      - name: grouped_learned_repair
        source_labels:
          - grouped128_learned_repair_seed_b8c698d26a_seed_c3aac2f9dc_policy_000001
          - grouped128_learned_repair_seed_b8c698d26a_seed_c3aac2f9dc_policy_000002
          - grouped128_learned_repair_seed_b8c698d26a_seed_c3aac2f9dc_checkpoint_000025
          - grouped128_learned_repair_seed_b8c698d26a_seed_c3aac2f9dc_main_bestresponse_u25_devbest
          - grouped128_learned_repair_seed_b8c698d26a_seed_c3aac2f9dc_main_league_selected
          - grouped128_learned_repair_seed_b8c698d26a_seed_c3aac2f9dc_policy_000003
          - grouped128_learned_repair_seed_b8c698d26a_seed_c3aac2f9dc_policy_000004
          - grouped128_learned_repair_seed_b8c698d26a_seed_c3aac2f9dc_policy_000005
        fraction: 0.34
      - name: rawext256_b2_fixed_preserve
        source_labels:
          - rawext256_allfixed_preserve_B2 HeuristicPublic
        fraction: 0.18
      - name: a025_exact_b2_pair70_selected_preserve
        source_labels:
          - a025_b2_pair70_selected_preserve_B2 HeuristicPublic
        fraction: 0.24
      - name: rawext256_old_checkpoint_preserve
        source_labels:
          - rawext256_alllearned_preserve_seed_b8c698d26a_seed_c3aac2f9dc_checkpoint_000025
        fraction: 0.05
      - name: rawext256_old_bestresponse_preserve
        source_labels:
          - rawext256_alllearned_preserve_seed_b8c698d26a_seed_c3aac2f9dc_main_bestresponse_u25_devbest
        fraction: 0.05
