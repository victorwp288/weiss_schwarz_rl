schema_version: 2
description: "Selected-a015 conservative online continuation with a very small paired-loss replay correction. This keeps the conservative fixed-anchor floors from the online guard probe, but re-enables one low-pressure replay-BC pass over exact B1/B3/B2 fixed loss states and older hard-negative loss states. Intended as a u1/u2 filter only: continue only if paired confirm shows fixed >= 0 and learned > 0 versus selected-a015."
extends: main_league_champion_hardneg_selected_conservative_online_guard_probe.yaml
training:
  structured_aux:
    trajectory_bc_dataset_path: runs/trajectory_bc_grouped_b1hn_b1b3_b2loss_plus_fixedwins_20260519/trajectory_bc_grouped_b1hn_b1b3_b2loss_plus_fixedwins.npz
    trajectory_bc_every_updates: 1
    trajectory_bc_aux_updates: 1
    trajectory_bc_batch_episodes: 12
    trajectory_bc_teacher_action_coef: 0.10
    trajectory_bc_teacher_same_family_action_coef: 0.45
    trajectory_bc_teacher_same_family_action_margin_coef: 0.05
    trajectory_bc_focus_groups:
      - name: hard_negative_lossstate_repair
        source_labels:
          - hn_lossstate_policy000002_topaction
          - hn_lossstate_checkpoint000025_topaction
          - hn_lossstate_bestresponse_topaction
          - hn_lossstate_mainleague_topaction
        fraction: 0.08
      - name: fixed_b1b3_lossstate_repair
        source_labels:
          - b1_lossstate_confirm128_policyb_topaction
          - b3_lossstate_confirm128_policyb_topaction
        fraction: 0.08
      - name: fixed_b2_lossstate_repair
        source_labels:
          - b2_lossstate_grouped_u2_topaction
        fraction: 0.04
