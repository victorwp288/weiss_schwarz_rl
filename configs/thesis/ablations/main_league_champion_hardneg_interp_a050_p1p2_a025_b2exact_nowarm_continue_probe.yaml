schema_version: 2
description: "One-update no-warmup corrective probe from the p1/p2 a025 interpolation. The a025 candidate kept the live champion/hard-negative learned gains but failed the strict confirm128 gate by one B2 game. This config adds an exact paired-swing B2 preserve lane from selected-a015 winning actions against the a025 losing top actions, keeps learned repair visible, and uses a lower LR plus stronger retention/anchor so the live champion/hard-negative update does not wash out the learned panel. Continue only if confirm64 and confirm128 show no fixed or learned row drops versus selected-a015 and learned aggregate remains positive."
extends: main_league_champion_hardneg_interp_a050_b2_oldhn_continue_probe.yaml
league:
  warmup:
    first_updates: 0
training:
  optimizer:
    learning_rate: 0.000001
  structured_aux:
    policy_anchor_coef: 0.50
    policy_anchor_top_action_coef: 0.12
    trajectory_retention_coef: 0.10
    paired_swing_dataset_path: runs/paired_outcome_contrastive_grouped128_rawext256_plus_a025_b2exact_20260520/paired_outcome_contrastive_grouped128_rawext256_plus_a025_b2exact.npz
    paired_swing_coef: 0.045
    paired_swing_batch_episodes: 20
    paired_swing_focus_groups:
      - name: grouped_fixed_preserve
        source_labels:
