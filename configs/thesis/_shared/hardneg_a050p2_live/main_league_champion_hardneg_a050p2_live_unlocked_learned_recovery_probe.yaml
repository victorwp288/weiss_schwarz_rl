schema_version: 2
description: "One-update learned-recovery continuation from the fixed-recovered unlocked row-deficit child. The child repaired fixed rows at confirm64 but flattened learned gains, so this replay-free live probe shifts pressure toward champions and hard negatives while using B1/B2/B4 exposure as sentinel constraints. It is not a publication config: require live exposure, then sentinel fixed and learned nonnegative before any full confirm64, and require learned-positive full confirm64 before confirm128."
extends: main_league_champion_hardneg_a050p2_live_unlocked_rowdeficit_probe.yaml
league:
  sampling:
    noleague_baseline_reserved_envs_per_actor: 2
    noleague_baseline_mix_fraction: 0.20
    noleague_baseline_mix_end_updates: -1
    heuristic_public_mix_fraction: 0.035
    heuristic_public_final_mix_fraction: 0.035
    heuristic_public_variant_mix_fraction: 0.10
    heuristic_public_variant_final_mix_fraction: 0.10
    champion_mix_fraction: 0.34
    hard_negative_mix_fraction: 0.32
    hard_negative_min_samples: 3
    hard_negative_max_win_rate: 0.62
    hard_negative_overlaps_champions: true
    hard_negative_focus_policy_ids:
      - seed_c3aac2f9dc_checkpoint_000025
      - seed_c3aac2f9dc_main_bestresponse_u25_devbest
      - seed_c3aac2f9dc_main_league_selected
      - seed_c3aac2f9dc_policy_000001
      - seed_c3aac2f9dc_policy_000002
      - seed_c3aac2f9dc_policy_000003
      - seed_c3aac2f9dc_policy_000004
      - seed_c3aac2f9dc_policy_000005
    hard_negative_focus_weight_multiplier: 4.5
    row_deficit_policy_weights:
      seed_c3aac2f9dc_main_league_selected: 3.0
      seed_c3aac2f9dc_policy_000001: 4.0
      seed_c3aac2f9dc_policy_000003: 4.0
      seed_c3aac2f9dc_policy_000004: 4.0
      seed_c3aac2f9dc_policy_000005: 4.0
training:
  optimizer:
    learning_rate: 0.0000032
  exploration:
    entropy_coef: 0.0015
    actor_sampling_temperature: 0.92
  structured_aux:
    policy_anchor_coef: 0.06
    policy_anchor_top_action_coef: 0.01
    policy_anchor_temperature: 0.78
    trajectory_retention_coef: 0.0
