schema_version: 2
description: "One-update continuation from the confirm256-positive trainable-context u1 frontier. This excludes the known pair205 B2-vs-learned contradiction by replacing the full conflict paired-swing set with only non-conflicting B2 preserve rows, then adds low-pressure selected-a015 learned-preserve replay for policy0001/main-selected/policy0003."
