schema_version: 2
description: "Pair205-only state-conditioned opponent-context candidate-residual probe from the a075 frontier. Unlike the failed global action-ID bias probes, this adapter is a zero-init residual over packed legal candidates conditioned on row state, candidate metadata, and opponent context. It is adapter-only/base-frozen and must pass pair205 margins before any sentinel eval."
extends: main_league_champion_hardneg_a075_context_actionbias_pair205_adapteronly_strong_probe.yaml
model:
  opponent_context_trainable_action_bias_scale: 0.0
  opponent_context_trainable_candidate_residual_scale: 1.0
  opponent_context_candidate_residual_width: 32
  opponent_context_adapter_lr_multiplier: 2000.0
training:
  structured_aux:
    paired_swing_aux_updates: 8
    paired_swing_coef: 0.20
