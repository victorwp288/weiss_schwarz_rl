schema_version: 2
description: "Selected-a015 conservative online continuation with true paired-outcome contrastive replay. The replay dataset is built from exact paired flips: fixed rows use selected-a015 winning actions as positives over the grouped candidate's losing top actions, while learned rows use grouped-candidate winning actions as positives over selected-a015 losing top actions. This is a u2 structural probe only; continue only if real champion/hard-negative exposure is present and paired confirm shows fixed >= 0 and learned > 0 versus selected-a015."
