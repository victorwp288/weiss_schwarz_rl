schema_version: 2
description: "Selected-a015 champion/hard-negative continuation with explicit all-outcome replay-BC trust-region data from selected a015 against imported learned opponents. This keeps online champion/hard-negative pressure active while preventing the same-family action drift observed in the rejected B4guard retention-only segment."
extends: main_league_champion_hardneg_selected_retention_b4guard_probe.yaml
training:
  optimizer:
    learning_rate: 0.00001
  exploration:
    entropy_coef: 0.0015
    actor_sampling_temperature: 0.88
  structured_aux:
    policy_anchor_coef: 0.45
    policy_anchor_top_action_coef: 0.10
    policy_anchor_temperature: 0.65
    trajectory_retention_coef: 0.0
    trajectory_retention_sources: []
    trajectory_bc_dataset_path: runs/trajectory_bc_selected_a015_vs_imported_champions_all32_20260518/trajectory_bc_selected_a015_vs_imported_champions_all32.npz
    trajectory_bc_every_updates: 1
    trajectory_bc_aux_updates: 1
    trajectory_bc_batch_episodes: 12
    trajectory_bc_teacher_action_coef: 0.16
    trajectory_bc_teacher_same_family_action_coef: 0.65
    trajectory_bc_teacher_same_family_action_margin_coef: 0.08
    trajectory_bc_teacher_same_family_action_margin: 0.5
