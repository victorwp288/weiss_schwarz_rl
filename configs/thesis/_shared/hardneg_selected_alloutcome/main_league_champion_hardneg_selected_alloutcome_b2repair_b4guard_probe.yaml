schema_version: 2
description: "Selected-a015 all-outcome champion/hard-negative continuation with a light B2/public repair floor. This keeps the learned-opponent replay-BC trust region from the all-outcome probe, but adds small base-public teacher pressure and slightly higher B2 exposure so longer segmented training can improve champion/hard-negative play without silently trading away the fixed B2 baseline."
extends: ../hardneg_selected/main_league_champion_hardneg_selected_alloutcome_replaybc_b4guard_probe.yaml
league:
  sampling:
    heuristic_public_mix_fraction: 0.08
    heuristic_public_final_mix_fraction: 0.08
    heuristic_public_variant_mix_fraction: 0.14
    heuristic_public_variant_final_mix_fraction: 0.14
    hard_negative_mix_fraction: 0.20
training:
  optimizer:
    learning_rate: 0.0000075
  exploration:
    entropy_coef: 0.0012
    actor_sampling_temperature: 0.86
  structured_aux:
    teacher_public_heuristic_coef: 0.025
    teacher_public_heuristic_end_updates: -1
    teacher_public_heuristic_final_coef: 0.025
    teacher_public_heuristic_temperature: 2.0
    teacher_public_heuristic_profiles:
      - base
    teacher_public_heuristic_profile_mode: mixture
    teacher_public_heuristic_profiles_end_updates: -1
    policy_anchor_coef: 0.50
    policy_anchor_top_action_coef: 0.12
    policy_anchor_temperature: 0.65
    trajectory_bc_batch_episodes: 10
    trajectory_bc_teacher_action_coef: 0.14
    trajectory_bc_teacher_same_family_action_coef: 0.60
    trajectory_bc_teacher_same_family_action_margin_coef: 0.08
