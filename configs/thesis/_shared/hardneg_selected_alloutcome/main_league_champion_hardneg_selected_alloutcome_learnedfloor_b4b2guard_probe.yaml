schema_version: 2
description: "Selected-a015 all-outcome champion/hard-negative continuation with a learned-row floor. This backs off the B2-repair public-teacher pressure that improved fixed anchors but lost one learned confirm128 win, restores stronger replay-BC trust-region pressure, and raises champion/hard-negative exposure while keeping B2/B4 under paired-seed guardrails."
extends: main_league_champion_hardneg_selected_alloutcome_b2repair_b4guard_probe.yaml
league:
  sampling:
    noleague_baseline_mix_fraction: 0.30
    noleague_baseline_mix_end_updates: -1
    heuristic_public_mix_fraction: 0.06
    heuristic_public_final_mix_fraction: 0.06
    heuristic_public_variant_mix_fraction: 0.12
    heuristic_public_variant_final_mix_fraction: 0.12
    champion_mix_fraction: 0.26
    hard_negative_mix_fraction: 0.22
    hard_negative_min_samples: 2
    hard_negative_max_win_rate: 0.60
training:
  optimizer:
    learning_rate: 0.000006
  exploration:
    entropy_coef: 0.0010
    actor_sampling_temperature: 0.84
  structured_aux:
    teacher_public_heuristic_coef: 0.018
    teacher_public_heuristic_final_coef: 0.018
    policy_anchor_coef: 0.55
    policy_anchor_top_action_coef: 0.14
    policy_anchor_temperature: 0.65
    trajectory_bc_batch_episodes: 14
    trajectory_bc_teacher_action_coef: 0.18
    trajectory_bc_teacher_same_family_action_coef: 0.68
    trajectory_bc_teacher_same_family_action_margin_coef: 0.10
