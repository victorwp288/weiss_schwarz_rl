schema_version: 2
description: "Selected-a015 all-outcome champion/hard-negative continuation with an explicit paired-swing repair replay dataset. This keeps the learned-push opponent ecology, but replaces the broad all-outcome replay-BC data with a merged all32-plus-4x hard-negative regression pocket built from selected-a015 wins on the paired seeds where learned-push candidates lost ground against imported champions/hard negatives."
extends: main_league_champion_hardneg_selected_alloutcome_learnedpush_b4b2guard_probe.yaml
training:
  optimizer:
    learning_rate: 0.000006
  structured_aux:
    policy_anchor_coef: 0.44
    policy_anchor_top_action_coef: 0.09
    policy_anchor_temperature: 0.68
    trajectory_bc_dataset_path: runs/trajectory_bc_selected_a015_all32_plus_swing4x_20260518/trajectory_bc_selected_a015_all32_plus_swing4x.npz
    trajectory_bc_batch_episodes: 10
    trajectory_bc_teacher_action_coef: 0.13
    trajectory_bc_teacher_same_family_action_coef: 0.56
    trajectory_bc_teacher_same_family_action_margin_coef: 0.07
