    policy_anchor_top_action_coef: 0.13
    policy_anchor_temperature: 0.64
    trajectory_bc_dataset_path: runs/trajectory_bc_selected_a015_disjoint4x_plus_extensionp5win2x_20260518/trajectory_bc_selected_a015_disjoint4x_plus_extensionp5win2x.npz
    trajectory_bc_batch_episodes: 14
