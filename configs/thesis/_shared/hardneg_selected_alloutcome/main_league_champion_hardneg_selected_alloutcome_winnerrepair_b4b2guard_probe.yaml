schema_version: 2
description: "Selected-a015 champion/hard-negative continuation with disjoint winner replay repair. This keeps the focused old-hard-negative plus B2/B4 retention ecology, but replaces the extension-seed replay data with a thesis-defensible disjoint train-seed mixture: selected-a015 hard-negative preservation wins plus extension-repair p5 hard-negative wins that represent real learned-opponent gains. Confirm/eval seeds remain held out."
extends: main_league_champion_hardneg_selected_alloutcome_focusoldhn_b2retention_b4b2guard_probe.yaml
reproducibility:
