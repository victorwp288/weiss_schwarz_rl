schema_version: 2
description: structured_acceptance local tiny64 learning frontier
extends: structured_acceptance.yaml
system:
  collection_backend: central
  actor_process_count: 32
  actor_torch_threads: 1
  learner_torch_threads: 16
model:
  gru_hidden_size: 64
  encoder_mlp_width: 64
  typed_feature_width: 16
  public_heuristic_logit_bias_scale: 1.0
  public_heuristic_actor_logit_bias_scale: 1.0
training:
  profile_timers: true
  fixed_opponent_backend: simulator_native
  actor_policy_backend: heuristic_public
  actor_heuristic_fraction: 1.0
  actor_heuristic_end_updates: 5
  actor_heuristic_final_fraction: 0.0
  structured_aux:
    teacher_public_heuristic_coef: 0.1
  structured_warmstart:
    updates: 1
    teacher_public_heuristic_coef: 0.5
evaluation:
  periodic_dev_eval_interval_updates: 5
league:
  sampling:
    heuristic_public_start_updates: 0
    heuristic_public_mix_fraction: 1.0
    noleague_baseline_mix_fraction: 0.15
    noleague_baseline_mix_end_updates: 5
