schema_version: 2
description: clean sim-0.8.1 main League GRU run using fresh B1 anchor, no legacy resume/seed snapshots
extends: structured_acceptance_standard_auto_gpu_exp031_champion_reserved_b1_lane.yaml
system:
  collection_backend: auto
training:
  actor_policy_backend: model
  actor_heuristic_fraction: 0.0
  actor_heuristic_final_fraction: 0.0
  train_on_heuristic_actor_rows: false
  structured_warmstart:
    enabled: true
    updates: 32
league:
  sampling:
    noleague_baseline_reserved_envs_per_actor: 1
    noleague_baseline_mix_fraction: 0.25
    noleague_baseline_mix_end_updates: -1
    champion_mix_fraction: 0.45
    hard_negative_mix_fraction: 0.15
    heuristic_public_mix_fraction: 0.0
    heuristic_public_final_mix_fraction: 0.0
