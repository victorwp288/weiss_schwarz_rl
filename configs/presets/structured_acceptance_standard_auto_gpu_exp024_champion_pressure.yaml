schema_version: 2
description: "exp-024 scout: preserve B1 gains while freeing lanes for admitted champions and early hard-negative pressure"
extends: structured_acceptance_standard_auto_gpu.yaml
league:
  warmup:
    first_updates: 5
    initial_window_episodes: 512
    ramp_target_updates: 20
    ramp_target_window_episodes: 4096
  pool:
    recent_size: 24
    champion_size: 4
    champion_max_age_updates: 0
  sampling:
    # Keep one hard B1 lane, but do not reserve B2: exp-023's two reserved lanes starved champion sampling.
    noleague_baseline_reserved_envs_per_actor: 1
    heuristic_public_reserved_envs_per_actor: 0
    noleague_baseline_mix_fraction: 0.20
    noleague_baseline_mix_end_updates: -1
    heuristic_public_mix_fraction: 0.30
    heuristic_public_final_mix_fraction: 0.15
    heuristic_public_mix_end_updates: 120
    champion_mix_fraction: 0.40
    hard_negative_mix_fraction: 0.20
    hard_negative_min_samples: 8
    hard_negative_max_win_rate: 0.50
    pfsp_epsilon_uniform: 0.15
