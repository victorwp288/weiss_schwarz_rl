schema_version: 2
description: fast no-GRU IMPALA no-league B0-only training baseline for old-sim thesis comparison
extends: baselines/norecurrence_impala.yaml
system:
  collection_backend: auto
league:
  enabled: false
  promotion:
    anchor_set_v1:
      required:
        - B0 RandomLegal
      optional_if_available: []
  sampling:
    noleague_baseline_reserved_envs_per_actor: 0
    noleague_baseline_mix_fraction: 0.0
    heuristic_public_mix_fraction: 0.0
    heuristic_public_final_mix_fraction: 0.0
evaluation:
  periodic_dev_eval_interval_updates: 25
  periodic_dev_eval_paired_seeds: 8
  final_policy_set_selection:
    fixed_anchor_set_v1:
      required:
        - B0 RandomLegal
      optional_if_available: []
