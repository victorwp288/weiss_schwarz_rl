schema_version: 2
description: "exp-023 scout: explicit B1/B2 reserved lanes with early league warmup so B1 NoLeague is active throughout the candidate run"
extends: structured_acceptance_standard_auto_gpu.yaml
league:
  warmup:
    # Default standard surface gates NoLeague baseline activity until update 200.
    # That made exp-022's reserved B1 lane invisible for almost the whole run.
    first_updates: 5
    initial_window_episodes: 512
    ramp_target_updates: 20
    ramp_target_window_episodes: 4096
  sampling:
    noleague_baseline_reserved_envs_per_actor: 1
    heuristic_public_reserved_envs_per_actor: 1
    noleague_baseline_mix_fraction: 0.25
    noleague_baseline_mix_end_updates: -1
    heuristic_public_mix_fraction: 0.55
    heuristic_public_final_mix_fraction: 0.35
    heuristic_public_mix_end_updates: 120
    pfsp_epsilon_uniform: 0.15
