schema_version: 2
description: fast no-GRU IMPALA baseline without imported GRU B1 anchor; evaluates B0/B2 anchors only
extends: baselines/norecurrence_impala.yaml
system:
  collection_backend: auto
league:
  promotion:
    anchor_set_v1:
      required:
        - B0 RandomLegal
      optional_if_available:
        - B2 HeuristicPublic
  sampling:
    noleague_baseline_reserved_envs_per_actor: 0
    noleague_baseline_mix_fraction: 0.0
evaluation:
  final_policy_set_selection:
    fixed_anchor_set_v1:
      required:
        - B0 RandomLegal
      optional_if_available:
        - B2 HeuristicPublic
