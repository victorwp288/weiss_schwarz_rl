schema_version: 2
extends: ../typed_thesis_locked.yaml
description: "Baseline PPO-lite preset"
experiment:
  role: baseline_ppo_lite
model:
  encoder_kind: mlp
training:
  algorithm: ppo_lite_masked_v1
  optimizer:
    learning_rate: 0.00015
    grad_norm_clip: 10.0
  exploration:
    entropy_coef: 0.005
    entropy_anneal_to: 0.001
    entropy_anneal_steps_updates: 2000000
  precision:
    mixed_precision: false
  ppo:
    clip_epsilon: 0.2
    value_clip_epsilon: 0.2
    gae_lambda: 0.95
    epochs: 4
    target_kl: 0.03
    normalize_advantages: true
