schema_version: 2
description: reduced-size B1-anchored league bridge with mostly heuristic rows plus a live model-policy lane
extends: structured_acceptance_thesis_model_server_train_auto_gpu_b1anchored_league_benchmark_localpromo.yaml
training:
  actor_policy_backend: heuristic_public
  actor_heuristic_fraction: 0.85
  actor_heuristic_final_fraction: 0.85
  train_on_heuristic_actor_rows: true
  behavior_action_bc_coef: 0.0
  heuristic_native_rollout_enabled: false
  heuristic_actor_hidden_state_tracking: true
  optimizer:
    learning_rate: 0.00002
  exploration:
    entropy_coef: 0.035
    entropy_anneal_to: 0.015
    entropy_anneal_steps_updates: 300000
  structured_aux:
    teacher_family_coef: 0.15
    teacher_slot_coef: 0.075
    teacher_action_coef: 0.075
    teacher_attack_type_coef: 0.04
    teacher_public_heuristic_coef: 0.075
    teacher_public_heuristic_final_coef: 0.075
    teacher_public_main_move_coef: 0.075
