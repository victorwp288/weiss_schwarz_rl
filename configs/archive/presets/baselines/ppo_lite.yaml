schema_version: 2
extends: ../structured_acceptance_thesis_model_auto_gpu.yaml
description: "Baseline PPO-lite preset aligned to the frozen thesis-model surface"
experiment:
  role: baseline_ppo_lite
curriculum:
  early_cutoff:
    enabled: true
    warmup_updates: 120
    patience_updates: 120
    min_improvement: 0.01
    stall_patience_evals: 4
    stall_rate_threshold: 0.25
training:
  algorithm: ppo_lite_masked_v1
  structured_warmstart:
    enabled: false
    updates: 0
  optimizer:
    learning_rate: 0.00015
    grad_norm_clip: 10.0
  exploration:
    entropy_coef: 0.005
    entropy_anneal_to: 0.001
    entropy_anneal_steps_updates: 2000000
  precision:
    mixed_precision: false
  ppo:
    clip_epsilon: 0.2
    value_clip_epsilon: 0.2
    gae_lambda: 0.95
    epochs: 4
    target_kl: 0.03
    normalize_advantages: true
