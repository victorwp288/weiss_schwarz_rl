schema_version: 2
description: reduced-size B1-anchored league preset for local learning iteration before full-size server runs
extends: baselines/structured_acceptance_thesis_model_server_train_auto_gpu_noleague_benchmark.yaml
experiment:
  role: main
model:
  public_heuristic_logit_bias_profile: aggressive
  public_heuristic_logit_bias_scale: 3.0
training:
  train_on_heuristic_actor_rows: true
  diverse_opponent_actor_count: 0
  diverse_model_actor_count: 0
  heuristic_native_rollout_enabled: true
  heuristic_actor_hidden_state_tracking: false
  heuristic_native_rollout_profile: aggressive
  optimizer:
    learning_rate: 0.00005
  structured_aux:
    teacher_family_coef: 0.2
    teacher_slot_coef: 0.1
    teacher_action_coef: 0.1
    teacher_attack_type_coef: 0.05
    teacher_public_heuristic_profiles:
      - aggressive
    teacher_public_heuristic_label_profile: aggressive
    teacher_public_heuristic_coef: 0.1
    teacher_public_heuristic_final_coef: 0.1
    teacher_public_heuristic_temperature: 8.0
    teacher_public_main_move_coef: 0.1
league:
  enabled: true
  sampling:
    heuristic_public_mix_fraction: 0.55
    heuristic_public_final_mix_fraction: 0.35
    heuristic_public_mix_end_updates: 400
    heuristic_public_variant_mix_fraction: 0.20
    heuristic_public_variant_final_mix_fraction: 0.20
    heuristic_public_variant_mix_end_updates: 400
    noleague_baseline_mix_fraction: 0.25
    noleague_baseline_mix_end_updates: 400
    champion_mix_fraction: 0.20
    hard_negative_mix_fraction: 0.15
curriculum:
  early_cutoff:
    enabled: false
  checkpoint_guard:
    enabled: true
    min_best_score: 0.55
    rollback_score_margin: 0.01
