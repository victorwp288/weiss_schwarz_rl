schema_version: 2
description: reduced-size B1-anchored league preset for real model-policy self-play after B1 heuristic warmup
extends: structured_acceptance_thesis_model_server_train_auto_gpu_b1anchored_league_benchmark_localpromo.yaml
training:
  actor_policy_backend: model
  actor_heuristic_fraction: 0.0
  actor_heuristic_final_fraction: 0.0
  train_on_heuristic_actor_rows: false
  behavior_action_bc_coef: 0.0
  diverse_opponent_actor_count: -1
  heuristic_native_rollout_enabled: false
  heuristic_actor_hidden_state_tracking: true
  optimizer:
    learning_rate: 0.00002
  exploration:
    entropy_coef: 0.05
    entropy_anneal_to: 0.02
    entropy_anneal_steps_updates: 300000
  structured_aux:
    teacher_family_coef: 0.1
    teacher_slot_coef: 0.05
    teacher_action_coef: 0.05
    teacher_attack_type_coef: 0.025
    teacher_public_heuristic_coef: 0.05
    teacher_public_heuristic_final_coef: 0.05
    teacher_public_main_move_coef: 0.05
league:
  sampling:
    heuristic_public_mix_fraction: 0.35
    heuristic_public_final_mix_fraction: 0.25
    heuristic_public_mix_end_updates: 400
    heuristic_public_variant_mix_fraction: 0.25
    heuristic_public_variant_final_mix_fraction: 0.25
    heuristic_public_variant_mix_end_updates: 400
    noleague_baseline_mix_fraction: 0.25
    noleague_baseline_mix_end_updates: 400
    champion_mix_fraction: 0.25
    hard_negative_mix_fraction: 0.20
