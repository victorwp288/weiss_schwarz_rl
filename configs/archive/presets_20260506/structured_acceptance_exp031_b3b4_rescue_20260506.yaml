schema_version: 2
description: "Emergency continuation from main p21 with explicit B3/B4 heuristic-variant pressure and B1 retention lane"
extends: structured_acceptance_standard_auto_gpu_exp031_champion_reserved_b1_lane.yaml
evaluation:
  eval_device: cpu
  periodic_dev_eval_interval_updates: 10
  periodic_dev_eval_paired_seeds: 8
  final_matrix_stage1_paired_seeds: 16
  final_matrix_stage2_adaptive_max_paired_seeds: 16
  final_policy_set_selection:
    fixed_anchor_set_v1:
      required:
        - B0 RandomLegal
        - B1 NoLeague baseline
        - B2 HeuristicPublic
        - B3 HeuristicPublicAggro
        - B4 HeuristicPublicControl
      optional_if_available: []
league:
  sampling:
    noleague_baseline_reserved_envs_per_actor: 1
    heuristic_public_reserved_envs_per_actor: 0
    noleague_baseline_mix_fraction: 0.15
    noleague_baseline_mix_end_updates: -1
    heuristic_public_mix_fraction: 0.0
    heuristic_public_final_mix_fraction: 0.0
    heuristic_public_mix_end_updates: 1
    heuristic_public_variant_mix_fraction: 0.45
    heuristic_public_variant_mix_end_updates: -1
    heuristic_public_variant_final_mix_fraction: 0.45
    champion_mix_fraction: 0.30
    hard_negative_mix_fraction: 0.10
    hard_negative_min_samples: 4
    hard_negative_max_win_rate: 0.55
    pfsp_epsilon_uniform: 0.20
    pfsp_power: 1.5
    opponent_sampling: PFSP
    pfsp_stats_source: online_outcomes
